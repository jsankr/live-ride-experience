# Tests on every PR; on main, publishes public/ to GitHub Pages (HTTPS),
# which is what lets the app open straight from a phone browser.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Test and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- public/js/cockpit.js public/js/cockpit.js.LEGAL.txt public/leaflet
      - run: npm test
      - name: Run Chromium browser checks
        run: |
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_PATH="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
          fi
          npm run test:browser

  # Upload and deploy run in separate jobs: when they share a job, deploy-pages
  # can look up the artifact ~0.5 s after upload, before GitHub has indexed it,
  # and fails with 'No artifacts named "github-pages"' (actions/deploy-pages#451).
  pages-artifact:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/configure-pages@v5
      # GitHub's Pages API sometimes answers 500 ("re-run the deployment at a later time").
      # deploy-pages gives up on the first error, which leaves the site on an old build,
      # so retry twice, waiting 1 and then 3 minutes. A real failure still fails the job.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 180
      - id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
